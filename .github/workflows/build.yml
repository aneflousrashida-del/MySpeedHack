name: Build Android SpeedHack APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Auto Fix and Build APK
      run: |
        cd app
        echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.1.1' } }" > ../build.gradle
        echo "allprojects { repositories { google(); mavenCentral() } }" >> ../build.gradle
        chmod +x gradlew || true
        ./gradlew assembleRelease || gradle assembleRelease
        
